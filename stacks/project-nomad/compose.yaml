name: project-nomad
services:
  # Project N.O.M.A.D. (Admin / Command Center)
  # https://github.com/Crosstalk-Solutions/project-nomad
  admin:
    image: ghcr.io/crosstalk-solutions/project-nomad:latest
    pull_policy: always
    container_name: nomad_admin
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - ${NOMAD_PORT}:8080
    environment:
      - NODE_ENV=production
      - PORT=8080
      - LOG_LEVEL=info
      - APP_KEY=${NOMAD_APP_KEY}
      - HOST=0.0.0.0
      - URL=${NOMAD_URL}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=nomad
      - DB_USER=nomad_user
      - DB_PASSWORD=${NOMAD_DB_PASSWORD}
      - DB_NAME=nomad
      - DB_SSL=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DISABLE_COMPRESSION=false
    volumes:
      - ${NOMAD_STORAGE_PATH}:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - nomad-update-shared:/app/update-shared
    networks:
      - nomad
      - proxy_net
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/api/health
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # Dozzle (Logs Viewer)
  dozzle:
    image: docker.io/amir20/dozzle:v10.0
    container_name: nomad_dozzle
    restart: unless-stopped
    environment:
      - DOZZLE_ENABLE_ACTIONS=false
      - DOZZLE_ENABLE_SHELL=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy_net
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # MySQL Database
  mysql:
    image: docker.io/library/mysql:8.0
    container_name: nomad_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${NOMAD_MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=nomad
      - MYSQL_USER=nomad_user
      - MYSQL_PASSWORD=${NOMAD_DB_PASSWORD}
    volumes:
      - ${NOMAD_MYSQL_PATH}:/var/lib/mysql
    networks:
      - nomad
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      interval: 30s
      timeout: 10s
      retries: 10
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nomad_redis
    restart: unless-stopped
    volumes:
      - ${NOMAD_REDIS_PATH}:/data
    networks:
      - nomad
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # Project N.O.M.A.D. Updater (Sidecar Updater)
  updater:
    image: ghcr.io/crosstalk-solutions/project-nomad-sidecar-updater:latest
    pull_policy: always
    container_name: nomad_updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NOMAD_UPDATER_PATH}:/opt/project-nomad
      - nomad-update-shared:/shared
    networks:
      - nomad
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # Project N.O.M.A.D. Disk Collector (Disk Usage)
  disk-collector:
    image: ghcr.io/crosstalk-solutions/project-nomad-disk-collector:latest
    pull_policy: always
    container_name: nomad_disk_collector
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
      - ${NOMAD_STORAGE_PATH}:/storage
    networks:
      - nomad
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
volumes:
  nomad-update-shared:
    driver: local
networks:
  nomad:
    name: project-nomad_default
    driver: bridge
  proxy_net:
    external: true
    name: proxy_net
