name: forgejo
services:
  # Forgejo (Git Server)
  # https://forgejo.org/docs/next/admin/installation/
  forgejo:
    image: data.forgejo.org/forgejo/forgejo:15
    container_name: forgejo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - ${FORGEJO_HTTP_PORT}:3000
    environment:
      - USER_UID=${USER_UID}
      - USER_GID=${USER_GID}
      - TZ=${TIMEZONE}
      # Database
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${FORGEJO_DB_PASSWORD}
    volumes:
      - ${FORGEJO_DATA}:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy_net
      - forgejo
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/healthz ||
          exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # PostgreSQL (Forgejo Database)
  db:
    image: docker.io/library/postgres:14
    container_name: forgejo-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=${FORGEJO_DB_PASSWORD}
      - POSTGRES_DB=forgejo
    volumes:
      - ${FORGEJO_DB_DATA}:/var/lib/postgresql/data
    networks:
      - forgejo
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: pg_isready -U forgejo
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # DIND (Docker in Docker)
  docker-in-docker:
    image: docker.io/library/docker:dind
    container_name: forgejo-dind
    privileged: true
    restart: unless-stopped
    command:
      - dockerd
      - -H
      - tcp://0.0.0.0:2375
      - --tls=false
      - --dns
      - 9.9.9.9
      - --dns
      - 149.112.112.112
    networks:
      - forgejo
  # Forgejo Runner (Git Automation)
  forgejo-runner:
    image: data.forgejo.org/forgejo/runner:12
    container_name: forgejo-runner
    restart: unless-stopped
    depends_on:
      docker-in-docker:
        condition: service_started
    user: 1001:1001
    environment:
      - TZ=${TIMEZONE}
      - DOCKER_HOST=tcp://docker-in-docker:2375
    volumes:
      - ${FORGEJO_RUNNER_DATA}:/data
    networks:
      - forgejo
    command: forgejo-runner daemon --config runner-config.yml
    security_opt:
      - no-new-privileges:true
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
networks:
  forgejo: null
  proxy_net:
    external: true
