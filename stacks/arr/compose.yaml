name: arr
services:
  # Gluetun (VPN)
  # https://github.com/qdm12/gluetun
  gluetun:
    image: docker.io/qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Web UIs for the services sharing Gluetun's namespace are published here.
      - ${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}
      - ${SABNZBD_PORT}:8080
      - ${PROWLARR_PORT}:9696
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_CITIES=${SERVER_CITIES}
      - DNS_KEEP_NAMESERVER=${DNS_KEEP_NAMESERVER}
      - FIREWALL_INPUT_SUBNETS=${FIREWALL_INPUT_SUBNETS}
      - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS}
    networks:
      - media_net
      - proxy_net
    healthcheck:
      test: ping -c 1 google.com || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - wud.watch=false
  # qBittorrent (Torrent client, routed through Gluetun)
  # https://docs.linuxserver.io/images/docker-qbittorrent/
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
      - TORRENTING_PORT=${QBITTORRENT_TORRENTING_PORT}
    volumes:
      - ${QBITTORRENT_CONFIG}:/config
      - ${TORRENTS_PATH}:/torrents
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:${QBITTORRENT_WEBUI_PORT}/
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # SABnzbd (Usenet client, routed through Gluetun)
  # https://docs.linuxserver.io/images/docker-sabnzbd/
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${SABNZBD_CONFIG}:/config
      - ${USENET_INCOMPLETE_PATH}:/incomplete-downloads
      - ${USENET_COMPLETE_PATH}:/downloads
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # Prowlarr (Indexers, routed through Gluetun)
  # https://docs.linuxserver.io/images/docker-prowlarr
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${PROWLARR_CONFIG}:/config
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:9696/
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # Radarr (Movies)
  # https://docs.linuxserver.io/images/docker-radarr
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - ${RADARR_PORT}:7878
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${RADARR_CONFIG}:/config
      - ${MOVIES_PATH}:/movies
      - ${USENET_COMPLETE_PATH}:/downloads
      - ${TORRENTS_PATH}:/torrents
    networks:
      - media_net
      - proxy_net
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:7878/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # Sonarr (TV)
  # https://docs.linuxserver.io/images/docker-sonarr
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - ${SONARR_PORT}:8989
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${SONARR_CONFIG}:/config
      - ${TV_PATH}:/tv
      - ${USENET_COMPLETE_PATH}:/downloads
      - ${TORRENTS_PATH}:/torrents
    networks:
      - media_net
      - proxy_net
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:8989/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # Lidarr (Music)
  # https://docs.linuxserver.io/images/docker-lidarr
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    ports:
      - ${LIDARR_PORT}:8686
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${LIDARR_CONFIG}:/config
      - ${MUSIC_PATH}:/music
      - ${USENET_COMPLETE_PATH}:/downloads
      - ${TORRENTS_PATH}:/torrents
    networks:
      - media_net
      - proxy_net
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:8686/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # Whisparr (Adult)
  # https://docs.linuxserver.io/images/docker-whisparr/
  whisparr:
    container_name: whisparr
    image: ghcr.io/hotio/whisparr:latest
    restart: unless-stopped
    ports:
      - ${WHISPARR_PORT}:6969
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - UMASK=002
    volumes:
      - ${WHISPARR_CONFIG}:/config
      - ${XXX_PATH}:/xxx
      - ${USENET_COMPLETE_PATH}:/downloads
      - ${TORRENTS_PATH}:/torrents
    networks:
      - media_net
      - proxy_net
    healthcheck:
      test:
        - CMD
        - wget
        - -qO
        - /dev/null
        - --tries=1
        - --timeout=5
        - http://127.0.0.1:6969/ping
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # LazyLibrarian (Books)
  # https://docs.linuxserver.io/images/docker-lazylibrarian/
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    restart: unless-stopped
    ports:
      - ${LAZYLIBRARIAN_PORT}:5299
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - DOCKER_MODS=linuxserver/mods:universal-calibre|linuxserver/mods:lazylibrarian-ffmpeg #optional
    volumes:
      - ${LAZYLIBRARIAN_CONFIG}:/config
      - ${BOOKS_PATH}:/books
      - ${USENET_COMPLETE_PATH}:/downloads
      - ${TORRENTS_PATH}:/torrents
    networks:
      - media_net
      - proxy_net
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - -o
        - /dev/null
        - http://127.0.0.1:5299/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # Mylar3 (Comics)
  # https://docs.linuxserver.io/images/docker-mylar3
  mylar3:
    image: lscr.io/linuxserver/mylar3:latest
    container_name: mylar3
    restart: unless-stopped
    ports:
      # NOTE: MYLAR_PORT defaults to 8090, which clashes with qBittorrent's web
      # UI (also 8090, published on the host via gluetun). Set MYLAR_PORT to a
      # free host port (e.g. 8091) in .env before bringing the stack up.
      - ${MYLAR_PORT}:8090
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${MYLAR_CONFIG}:/config
      - ${COMICS_PATH}:/comics
      - ${COMICS_STAGING}:/comics-staging
      - ${TORRENTS_PATH}:/torrents
    networks:
      - media_net
      - proxy_net
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - -o
        - /dev/null
        - http://127.0.0.1:8090/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # Bazarr (Subtitles)
  # https://docs.linuxserver.io/images/docker-bazarr/
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - ${BAZARR_PORT}:6767
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${BAZARR_CONFIG}:/config
      - ${MOVIES_PATH}:/movies
      - ${TV_PATH}:/tv
    networks:
      - media_net
      - proxy_net
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:6767/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # Seerr (Requests)
  # https://docs.seerr.dev/getting-started/docker/
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    ports:
      - ${SEERR_PORT}:5055
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${SEERR_CONFIG}:/app/config
    networks:
      - media_net
      - proxy_net
    healthcheck:
      test: wget --no-verbose --tries=1 --spider
        http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
networks:
  media_net:
    external: true
  proxy_net:
    external: true
