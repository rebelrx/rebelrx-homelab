name: joplin
services:
  # Joplin Server (Note Taking & Sync)
  # https://github.com/laurent22/joplin
  joplin:
    image: docker.io/joplin/server:latest
    container_name: joplin-server
    restart: unless-stopped
    depends_on:
      - joplin-db
    ports:
      - ${JOPLIN_PORT}:22300
    environment:
      - TZ=${TIMEZONE}
      - APP_PORT=22300
      - APP_BASE_URL=${JOPLIN_BASE_URL}
      - DB_CLIENT=pg
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=${POSTGRES_HOST}
    networks:
      - proxy_net
      - joplin
    security_opt:
      - no-new-privileges:true
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # Joplin PostgreSQL Database
  joplin-db:
    image: docker.io/library/postgres:16
    container_name: joplin-db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - ${JOPLIN_DB_DIR}:/var/lib/postgresql/data
    networks:
      - joplin
    security_opt:
      - no-new-privileges:true
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
networks:
  joplin:
    driver: bridge
  proxy_net:
    external: true
