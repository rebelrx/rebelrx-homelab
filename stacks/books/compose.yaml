name: books
services:
  # Calibre (Library Management)
  # https://docs.linuxserver.io/images/docker-calibre/
  calibre:
    image: lscr.io/linuxserver/calibre:latest
    container_name: calibre
    restart: unless-stopped
    ports:
      - ${CALIBRE_PORT_HTTP}:8080
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CALIBRE_CONFIG}:/config
      - ${CALIBRE_LIBRARY}:/books
      - ${CALIBRE_PLUGINS}:/plugins
    networks:
      - proxy_net
    shm_size: 1gb
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # Calibre-Web (Web Reader)
  # https://docs.linuxserver.io/images/docker-calibre-web/
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    restart: unless-stopped
    ports:
      - ${CALIBREWEB_PORT}:8083
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - DOCKER_MODS=linuxserver/mods:universal-calibre
    volumes:
      - ${CALIBREWEB_CONFIG}:/config
      - ${CALIBRE_LIBRARY}:/books
    networks:
      - proxy_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - -o
        - /dev/null
        - http://127.0.0.1:8083/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # Kavita (Comic/Book Reader)
  # https://docs.linuxserver.io/images/docker-kavita/#application-setup
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    restart: unless-stopped
    ports:
      - ${KAVITA_PORT}:5000
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${KAVITA_CONFIG}:/config
      - ${KAVITA_LIBRARY}:/data
    networks:
      - proxy_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - -o
        - /dev/null
        - http://127.0.0.1:5000/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
networks:
  proxy_net:
    external: true
