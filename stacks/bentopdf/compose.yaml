name: bentopdf
services:
  # BentoPDF (PDF Tools)
  # https://github.com/alam00000/bentopdf
  bentopdf:
    image: ghcr.io/alam00000/bentopdf:latest
    container_name: bentopdf
    restart: unless-stopped
    ports:
      - ${BENTOPDF_PORT}:8080
    environment:
      - TZ=${TIMEZONE}
    networks:
      - proxy_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
networks:
  proxy_net:
    external: true
