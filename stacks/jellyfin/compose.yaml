name: jellyfin
services:
  # Jellyfin (Media Server)
  # https://docs.linuxserver.io/images/docker-jellyfin/
  jellyfin:
    image: ghcr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "${JELLYFIN_HTTP_PORT}:8096"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_SERVER_URL}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ${JELLYFIN_CONFIG}:/config
      - ${JELLYFIN_TRANSCODE}:/transcode
      - ${JELLYFIN_MOVIES}:/movies
      - ${JELLYFIN_TV}:/tv
      - ${JELLYFIN_MUSIC}:/music
    networks:
      - media_net
      - proxy_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - -o
        - /dev/null
        - http://127.0.0.1:8096/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
networks:
  media_net:
    external: true
  proxy_net:
    external: true
