##############################################################################
# glances.conf :: system + GPU monitoring override
# OVERRIDE ONLY — Glances merges this over its built-in defaults (-C flag).
# Note: configparser only accepts comments on their OWN line, never inline
# after a value. Do not append "# ..." to a key=value line — it crashes.
# Docs: https://glances.readthedocs.io/en/latest/config.html
##############################################################################

[global]
check_update=false

# Plugins off. Already off by Glances default (not repeated below):
#   raid, smart, irq, connections, cloud, vms, npu, mpp, amps.
# NB: [wifi] disables wifi SIGNAL only; a wifi-chip TEMP is a [sensors] reading.
[wifi]
disable=True

[folders]
disable=True

[ports]
disable=True

[ip]
disable=True

# Network: allowlist the only interfaces worth graphing. show= takes precedence
# and suppresses everything else (all veth*/br*/docker*), robust to new names.
# hide_no_ip did NOT catch veths — the host-side peer often has a link-local IP.
# Replace enp4s0 with your host's LAN interface (find it via `ip -br link`).
[network]
show=enp4s0,tailscale0

# Filesystem: show ONLY the host root. Requires the /:/rootfs:ro bind mount in
# compose. Without that mount this shows nothing; use show=/ for the overlay.
[fs]
show=/rootfs

# Disk I/O: whole disks only.
[diskio]
hide=nvme.*p[0-9]+,loop.*

# Sensors: kept enabled (source of tctl CPU temp, composite NVMe temp, etc.).
# Optional prune of wifi + DIMM temps (chip names are examples — adjust to yours):
#[sensors]
#hide=unknown.*,mt7921.*,spd5118.*
