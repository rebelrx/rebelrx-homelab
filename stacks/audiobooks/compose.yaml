name: audiobooks
services:
  # Audiobookshelf (Audiobooks/podcast media server)
  # https://www.audiobookshelf.org/docs/#docker-compose-install
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    ports:
      - ${AUDIOBOOKSHELF_PORT}:80
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - ${AUDIOBOOKS_PATH}:/audiobooks
      - ${PODCASTS_PATH}:/podcasts
      - ${AUDIOBOOKSHELF_CONFIG}:/config
      - ${AUDIOBOOKSHELF_METADATA}:/metadata
    networks:
      - proxy_net
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:80/healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
networks:
  proxy_net:
    external: true
