name: sparkyfitness
services:
  # Postgres (Database)
  sparkyfitness-db:
    image: postgres:18.3-alpine
    container_name: sparkyfitness-db
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - POSTGRES_DB=${SPARKY_FITNESS_DB_NAME}
      - POSTGRES_USER=${SPARKY_FITNESS_DB_USER}
      - POSTGRES_PASSWORD=${SPARKY_FITNESS_DB_PASSWORD}
    volumes:
      - ${DB_PATH}:/var/lib/postgresql
    networks:
      - sparkyfitness_net
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # SparkyFitness (Fitness Tracker)
  # https://codewithcj.github.io/SparkyFitness/
  sparkyfitness-server:
    image: codewithcj/sparkyfitness_server:latest
    container_name: sparkyfitness-server
    restart: unless-stopped
    depends_on:
      - sparkyfitness-db
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - SPARKY_FITNESS_LOG_LEVEL=${SPARKY_FITNESS_LOG_LEVEL}
      - ALLOW_PRIVATE_NETWORK_CORS=${ALLOW_PRIVATE_NETWORK_CORS}
      - SPARKY_FITNESS_DB_USER=${SPARKY_FITNESS_DB_USER}
      - SPARKY_FITNESS_DB_HOST=${SPARKY_FITNESS_DB_HOST}
      - SPARKY_FITNESS_DB_NAME=${SPARKY_FITNESS_DB_NAME}
      - SPARKY_FITNESS_DB_PASSWORD=${SPARKY_FITNESS_DB_PASSWORD}
      - SPARKY_FITNESS_APP_DB_USER=${SPARKY_FITNESS_APP_DB_USER}
      - SPARKY_FITNESS_APP_DB_PASSWORD=${SPARKY_FITNESS_APP_DB_PASSWORD}
      - SPARKY_FITNESS_API_ENCRYPTION_KEY=${SPARKY_FITNESS_API_ENCRYPTION_KEY}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - SPARKY_FITNESS_FRONTEND_URL=${SPARKY_FITNESS_FRONTEND_URL}
      - SPARKY_FITNESS_DISABLE_SIGNUP=${SPARKY_FITNESS_DISABLE_SIGNUP}
      - SPARKY_FITNESS_FORCE_EMAIL_LOGIN=${SPARKY_FITNESS_FORCE_EMAIL_LOGIN}
      - SPARKY_FITNESS_EMAIL_HOST=${SPARKY_FITNESS_EMAIL_HOST}
      - SPARKY_FITNESS_EMAIL_PORT=${SPARKY_FITNESS_EMAIL_PORT}
      - SPARKY_FITNESS_EMAIL_SECURE=${SPARKY_FITNESS_EMAIL_SECURE}
      - SPARKY_FITNESS_EMAIL_USER=${SPARKY_FITNESS_EMAIL_USER}
      - SPARKY_FITNESS_EMAIL_PASS=${SPARKY_FITNESS_EMAIL_PASS}
      - SPARKY_FITNESS_EMAIL_FROM=${SPARKY_FITNESS_EMAIL_FROM}
    volumes:
      - ${SERVER_BACKUP_PATH}:/app/SparkyFitnessServer/backup
      - ${SERVER_UPLOADS_PATH}:/app/SparkyFitnessServer/uploads
    networks:
      - sparkyfitness_net
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # SparkyFitness Frontend
  sparkyfitness-frontend:
    image: codewithcj/sparkyfitness:latest
    container_name: sparkyfitness-frontend
    restart: unless-stopped
    depends_on:
      - sparkyfitness-server
    ports:
      - ${SPARKY_FITNESS_FRONTEND_PORT}:80
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - SPARKY_FITNESS_FRONTEND_URL=${SPARKY_FITNESS_FRONTEND_URL}
      - SPARKY_FITNESS_SERVER_HOST=sparkyfitness-server
      - SPARKY_FITNESS_SERVER_PORT=3010
    networks:
      - sparkyfitness_net
      - proxy_net
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
  # SparkyFitness MCP Server
  sparkyfitness-mcp:
    image: codewithcj/sparkyfitness_mcp:latest
    container_name: sparkyfitness-mcp
    restart: unless-stopped
    depends_on:
      - sparkyfitness-db
    ports:
      - 127.0.0.1:${SPARKY_FITNESS_MCP_PORT}:3001
    environment:
      - SPARKY_FITNESS_DB_USER=${SPARKY_FITNESS_DB_USER}
      - SPARKY_FITNESS_DB_HOST=${SPARKY_FITNESS_DB_HOST}
      - SPARKY_FITNESS_DB_NAME=${SPARKY_FITNESS_DB_NAME}
      - SPARKY_FITNESS_DB_PASSWORD=${SPARKY_FITNESS_DB_PASSWORD}
      - SPARKY_FITNESS_APP_DB_USER=${SPARKY_FITNESS_APP_DB_USER}
      - SPARKY_FITNESS_APP_DB_PASSWORD=${SPARKY_FITNESS_APP_DB_PASSWORD}
      - SPARKY_FITNESS_DB_PORT=5432
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - MCP_TRANSPORT=http
    networks:
      - sparkyfitness_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    labels:
      - wud.watch=true
      - wud.trigger.docker.enable=false
networks:
  sparkyfitness_net:
    name: sparkyfitness_net
    driver: bridge
  proxy_net:
    external: true
